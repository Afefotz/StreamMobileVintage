<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard VS</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');
    </style>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="overlay.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <div class="window">
        <div class="title-bar" id="overlay-title">Online_Match.exe</div>
        <div class="content">
            
            <div class="player-card">
                <div class="photo-frame" onclick="triggerPhotoUpload('p1')">
                    <img id="img-p1" src="https://via.placeholder.com/50?text=P1">
                </div>
                <div class="player-info">
                    <div id="name-p1" class="player-name" contenteditable="false" ondblclick="enableEdit(this, 'p1')">Player 1</div>
                    <div id="score-p1" class="score-box">0</div>
                </div>
            </div>

            <div class="vs">VS</div>

            <div class="player-card" style="flex-direction: row-reverse; text-align: right;">
                <div class="photo-frame" onclick="triggerPhotoUpload('p2')">
                    <img id="img-p2" src="https://via.placeholder.com/50?text=P2">
                </div>
                <div class="player-info">
                    <div id="name-p2" class="player-name" contenteditable="false" ondblclick="enableEdit(this, 'p2')">Player 2</div>
                    <div id="score-p2" class="score-box">0</div>
                </div>
            </div>

        </div>
    </div>

    <script refer src="overlay.js"></script>
    <input type="file" id="overlay-photo-input" accept="image/*" style="display:none" onchange="handleOverlayPhotoUpload(event)">
</body>
</html>
