<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win95 Scoreboard</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 20px; background-color: transparent; font-family: Arial, sans-serif; }

        .window {
            background-color: #c0c0c0;
            width: fit-content;
            border-top: 3px solid #fff; border-left: 3px solid #fff;
            border-right: 3px solid #000; border-bottom: 3px solid #000;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            padding: 4px; color: white; font-weight: bold; font-size: 14px;
        }

        .content {
            padding: 10px;
            display: flex; gap: 15px; align-items: center;
        }

        /* Tarjeta de Jugador */
        .player-card {
            display: flex; align-items: center; gap: 8px;
        }

        /* Marco de la foto hundido */
        .photo-frame {
            width: 50px; height: 50px;
            background: #fff;
            border: 2px solid; border-color: #808080 #fff #fff #808080;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }

        .player-info { display: flex; flex-direction: column; }
        
        .player-name {
            font-weight: bold; font-size: 14px; color: #000; margin-bottom: 2px;
            text-transform: uppercase;
        }

        /* Marcador estilo digital */
        .score-box {
            background: #000; color: #0f0; /* Verde matrix */
            font-family: 'VT323', monospace; font-size: 35px;
            padding: 0 10px; min-width: 40px; text-align: center;
            border: 2px solid; border-color: #808080 #fff #fff #808080;
        }

        .vs { font-weight: bold; color: #808080; font-style: italic; font-size: 20px; }

        /* --- ESTILOS PARA EL MODO SIN FOTOS --- */
        .modo-texto .photo-frame {
            display: none !important; /* Desaparece el cuadro 3D por completo */
        }
        
        .modo-texto .player-card {
            flex-direction: column !important; /* Apila el nombre sobre el marcador */
            justify-content: center;
        }
        
        .modo-texto .player-name {
            font-size: 16px;
            margin-bottom: 5px;
            text-align: center;
        }

    </style>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <div class="window">
        <div class="title-bar">Online_Match.exe</div>
        <div class="content">
            
            <div class="player-card">
                <div class="photo-frame">
                    <img id="img-p1" src="https://via.placeholder.com/50?text=P1">
                </div>
                <div class="player-info">
                    <div id="name-p1" class="player-name">Player 1</div>
                    <div id="score-p1" class="score-box">0</div>
                </div>
            </div>

            <div class="vs">VS</div>

            <div class="player-card" style="flex-direction: row-reverse; text-align: right;">
                <div class="photo-frame">
                    <img id="img-p2" src="https://via.placeholder.com/50?text=P2">
                </div>
                <div class="player-info">
                    <div id="name-p2" class="player-name">Player 2</div>
                    <div id="score-p2" class="score-box">0</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAcB2svnoMb1YOKQmwrrAa9i9vbSqxNprw",
            authDomain: "score-w95.firebaseapp.com",
            databaseURL: "https://score-w95-default-rtdb.firebaseio.com",
            projectId: "score-w95",
            storageBucket: "score-w95.firebasestorage.app",
            messagingSenderId: "244357143300",
            appId: "1:244357143300:web:e30629d5dbf0034f5bce51",
            measurementId: "G-R8VN2XHYM4"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        // db = firebase.database().ref('match_data'); NO MULTIUSUARIO, SOLO UN MATCH ACTIVO

        // 1. Obtener el parámetro 'room' de la URL (ej: control.html?room=mistream)
        const urlParams = new URLSearchParams(window.location.search);
        const currentRoom = urlParams.get('room');

        // 2. Validación de seguridad básica
        if (!currentRoom) {
            alert("No se especificó ninguna sala. Redirigiendo al inicio...");
            window.location.href = "index.html"; // Regresa al login si intentan entrar directo
        }

        // 3. Apuntar Firebase a la sala específica
        const db = firebase.database().ref(`rooms/${currentRoom}`);

        // Escuchar cambios
        db.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // Actualizar jugadores
                updatePlayer('p1', data.p1);
                updatePlayer('p2', data.p2);

                // Controlar el modo visual (con o sin fotos)
                const showPhotos = data.settings && data.settings.showPhotos !== undefined 
                                   ? data.settings.showPhotos 
                                   : true;
                
                const contentDiv = document.querySelector('.content');
                
                if (showPhotos) {
                    contentDiv.classList.remove('modo-texto'); // Se ven los cuadros y fotos
                } else {
                    contentDiv.classList.add('modo-texto');    // Desaparecen los cuadros, se centra el texto
                }
                
                // Seleccionamos todos los marcos de fotos y los ocultamos/mostramos
                const photoFrames = document.querySelectorAll('.photo-frame');
                photoFrames.forEach(frame => {
                    frame.style.display = showPhotos ? 'flex' : 'none';
                });
            }
        });

        function updatePlayer(id, data) {
            if (!data) return;
            
            // Actualizar texto
            document.getElementById(`name-${id}`).innerText = data.name || "PLAYER";
            document.getElementById(`score-${id}`).innerText = data.score || 0;
            
            // Actualizar imagen (si hay URL, úsala; si no, placeholder)
            const imgElement = document.getElementById(`img-${id}`);
            if (data.photo && data.photo.startsWith('http')) {
                imgElement.src = data.photo;
            } else {
                imgElement.src = `https://via.placeholder.com/50?text=${id.toUpperCase()}`;
            }
        }
    </script>
</body>
</html>
