<div id="container">
    <div class="title-bar"><div class="title-text">Semana 4</div></div>
    <div class="content-wrapper" style="display: flex; justify-content: space-around;">
        <div class="sunken-panel">
            <div id="p1-score" style="font-size: 50px; font-family: 'VT323';">0</div>
            <div style="font-size: 10px;">AFEFOTZ</div>
        </div>
        <div style="align-self: center; font-weight: bold;">VS</div>

<script>
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
    apiKey: "AIzaSyAcB2svnoMb1YOKQmwrrAa9i9vbSqxNprw",
    authDomain: "score-w95.firebaseapp.com",
    databaseURL: "https://score-w95-default-rtdb.firebaseio.com",
    projectId: "score-w95",
    storageBucket: "score-w95.firebasestorage.app",
    messagingSenderId: "244357143300",
    appId: "1:244357143300:web:e30629d5dbf0034f5bce51",
    measurementId: "G-R8VN2XHYM4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('scores');

    // Sincronización en tiempo real
    db.on('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
            document.getElementById('p1-score').innerText = data.p1;
            document.getElementById('p2-score').innerText = data.p2;
        }
    });
</script>
