<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Overlay Win95</title>
    <style>
        body { font-family: sans-serif; background: #008080; padding: 50px; text-align: center; }
        .window { background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; padding: 20px; max-width: 400px; margin: 0 auto; }
        input { padding: 5px; width: 80%; margin-bottom: 15px; }
        button { padding: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="window">
        <h2>Crear nueva sala de Stream</h2>
        <p>Ingresa tu nombre de usuario (sin espacios):</p>
        <input type="text" id="roomName" placeholder="ejemplo: mistream">
        <button onclick="generarLinks()">Entrar al Panel</button>
    </div>

    <script>
        function generarLinks() {
            let room = document.getElementById('roomName').value.trim().toLowerCase();
            room = room.replace(/[^a-z0-9]/g, ''); // Limpiar caracteres raros

            if(room.length > 0) {
                // Redirigir al panel de control pasando el nombre como parámetro
                window.location.href = `control.html?room=${room}`;
            } else {
                alert("Por favor ingresa un nombre válido.");
            }
        }
    </script>
</body>
</html>
