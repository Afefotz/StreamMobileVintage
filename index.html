<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Sala (overlay)</title>
    <!-- <style src="index.css"></style> ASÏ NO xdd-->
     <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="window">
        <div class="title-bar">ScoreVS_Room_Creator.exe</div>
        <h3 style="margin-top: 5px; color: #000;">Crear Sala de Overlay</h3>
        
        <p style="font-size: 14px; color: #333; margin-bottom: 5px;">Ingresa tu nombre de jugador (sin espacios):</p>
        <input type="text" id="roomName" placeholder="ejemplo: Fefemz">
        
        <p style="font-size: 14px; color: #333; margin-bottom: 5px; margin-top: 10px;">Selecciona tu diseño inicial:</p>
        <select id="start-theme" onchange="cambiarTemaPreview()" style="width: 85%; padding: 6px; margin-bottom: 20px; border: 2px solid; border-color: #808080 #fff #fff #808080;">
            <option value="theme-win95">Retro (Windows 95)</option>
            <option value="theme-modern-light">Moderno (Claro)</option>
            <option value="theme-modern">Moderno (Oscuro)</option>
            <option value="theme-pastel">Pastel (Suave)</option>
            <option value="theme-stone">Rocoso (Piedra)</option>
            <option value="theme-laser">Sci-Fi (Rojo Neón)</option>
            <option value="theme-neon">Cyberpunk (Neón Brillante)</option>
        </select>
        
        <br>
        <button onclick="generarLinks()">Generar y Entrar</button>
    </div>

    <script refer src="index.js"></script>
</body>
</html>
