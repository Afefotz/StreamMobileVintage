<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
        <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Stream Mobile Vintage</h1>
    </header>

    <main>
        <div id="containerW95">
            <div id="windowW95">
                <div id="titleBarW95">Online Matching</div>
                <div id="contentW95">
                    <div id="points">Puntos: 0</div>
                    <button class="win95-button-points" onclick="updatePoints(1)">+</button>
                    <button class="win95-button-points" onclick="updatePoints(-1)">-</button>
                    <button class="win95-button-points" onclick="updatePoints(0)">Reload</button>
                </div>
            </div>
        </div>

    <div class="container">
        <div class="row mb-5">
            <div class="col-md-8 text-center">
                <img src="assets/macbook-mockup.png" class="img-fluid">
            </div>
            <div class="col-md-4 my-auto">
                <div class="card">
                    <div class="card-header">
                        <h4 class="my-0 font-weight-normal">Check out personal page</h4>
                    </div>
                    <div class="card-body">
                        <ul class="list-unstyled mt-3 mb-4">
                            <li>Portfolio/Landing template</li>
                            <li>Alex's page</li>
                            <li>Cloud background</li>
                            <li>Winamp</li>
                            <li>It is very cool</li>
                        </ul>
                        <a href="personal_page.html" class="btn btn-lg btn-block"><img src="assets/icons/internet_connection_wiz-5.png" class="icon-16"> Okay, go</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<div class="window" style="width: 300px;">
    <div class="title-bar"><div class="title-text">Tournament_Score.exe</div></div>
    <div class="content-wrapper" style="display: flex; justify-content: space-around;">
        <div class="sunken-panel">
            <div id="p1-score" style="font-size: 50px; font-family: 'VT323';">0</div>
            <div style="font-size: 10px;">PLAYER 1</div>
        </div>
        <div style="align-self: center; font-weight: bold;">VS</div>
        <div class="sunken-panel">
            <div id="p2-score" style="font-size: 50px; font-family: 'VT323';">0</div>
            <div style="font-size: 10px;">PLAYER 2</div>
        </div>
    </div>
</div>

<script>
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
    apiKey: "AIzaSyAcB2svnoMb1YOKQmwrrAa9i9vbSqxNprw",
    authDomain: "score-w95.firebaseapp.com",
    databaseURL: "https://score-w95-default-rtdb.firebaseio.com",
    projectId: "score-w95",
    storageBucket: "score-w95.firebasestorage.app",
    messagingSenderId: "244357143300",
    appId: "1:244357143300:web:e30629d5dbf0034f5bce51",
    measurementId: "G-R8VN2XHYM4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('scores');

    // Sincronización en tiempo real
    db.on('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
            document.getElementById('p1-score').innerText = data.p1;
            document.getElementById('p2-score').innerText = data.p2;
        }
    });
</script>
    
    <footer>
        <div id="container">
            <div id="time">00:00:00</div>
            <div id="date">Cargando fecha...</div>
        </div>
    </footer>    
    
    <script src="script.js"></script>
</body>
</html>
