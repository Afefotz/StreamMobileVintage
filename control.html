<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Win95</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #008080; padding: 20px; }
        .window { background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; padding: 10px; max-width: 400px; margin: 0 auto; box-shadow: 4px 4px 10px rgba(0,0,0,0.5); }
        .title-bar { background: navy; color: white; padding: 3px 6px; margin-bottom: 15px; font-weight: bold; letter-spacing: 1px;}
        
        .player-section { border: 1px solid #808080; padding: 10px; margin-bottom: 15px; position: relative; }
        .section-title { position: absolute; top: -10px; left: 10px; background: #c0c0c0; padding: 0 5px; font-weight: bold; color: navy; }

        label { display: block; margin-top: 5px; font-size: 12px; }
        input[type="text"] { 
            width: 95%; padding: 3px; 
            border: 2px solid; border-color: #808080 #fff #fff #808080; /* Inset 3D */
        }

        .score-controls { display: flex; gap: 5px; margin-top: 10px; }
        button { 
            flex: 1; padding: 5px; background: #c0c0c0; 
            border: 2px solid; border-color: #fff #808080 #808080 #fff; 
            font-weight: bold; cursor: pointer;
        }
        button:active { border-color: #808080 #fff #fff #808080; transform: translate(1px, 1px); }
        .btn-update { width: 100%; margin-top: 5px; background: #000080; color: white; border-color: #fff #000 #000 #fff; }

        /* Apagar el diseño nativo del navegador */
        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background-color: #ffffff;
            /* Bordes invertidos para el efecto hundido */
            border: 2px solid; 
            border-color: #808080 #ffffff #ffffff #808080; 
            margin: 0;
            cursor: pointer;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        /* Dibujar la palomita negra cuando está activado */
        input[type="checkbox"]:checked::before {
            content: "✔"; /* Símbolo unicode clásico */
            color: #000000;
            font-size: 14px;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-weight: bold;
            position: absolute;
            top: -2px; /* Ajuste fino para centrar la palomita */
            left: 1px;
        }

        /* Foco punteado clásico al hacer clic */
        input[type="checkbox"]:focus {
            outline: 1px dotted #000000;
            outline-offset: 2px;
        }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <div class="window">
        <div class="title-bar">Versus_Admin_v1.exe</div>

        <div style="background: #c0c0c0; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 10px; margin-bottom: 15px;">
            <label style="font-family: 'Segoe UI', sans-serif; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: #000;">
            <input type="checkbox" id="toggle-photos" onchange="updateSettings()" checked>
                Mostrar Fotos
            </label>

            <label style="font-family: 'Segoe UI', sans-serif; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: #000;">
            <input type="checkbox" id="toggle-swap" onchange="updateSettings()">
                Voltear
            </label>
        </div>        

        <div class="player-section">
            <div class="section-title">PLAYER 1</div>
            
            <label>Nombre:</label>
            <input type="text" id="p1-name" placeholder="Ej: Goku">
            
            <div id="photo-input-p1" style="margin-top: 10px;">
                <label>Subir Foto:</label>
                <input type="file" accept="image/*" onchange="comprimirImagen(event, 'p1')" style="width: 100%; font-size: 11px;">
                <input type="hidden" id="p1-photo"> 
            </div>
            
            <button class="btn-update" onclick="updateInfo('p1')">💾 Actualizar Datos P1</button>

            <div class="score-controls" style="display: flex; gap: 8px; margin-top: 15px; height: 40px; align-items: stretch;">
                <button onclick="changeScore('p1', -1)" style="flex: 1; font-size: 18px; font-weight: bold; margin: 0;"> -1 </button>
                <div style="flex: 1.5; background: #000; color: #0f0; border: 2px solid; border-color: #808080 #fff #fff #808080; font-family: monospace; font-size: 24px; display: flex; justify-content: center; align-items: center; margin: 0;">
                    <span id="p1-current-score">0</span>
                </div>
                <button onclick="changeScore('p1', 1)" style="flex: 1; font-size: 18px; font-weight: bold; margin: 0;"> +1 </button>                
            </div>             
        </div>

        <div class="player-section">
            <div class="section-title">PLAYER 2</div>
            
            <label>Nombre:</label>
            <input type="text" id="p2-name" placeholder="Ej: Vegeta">
            
            <div id="photo-input-p2" style="margin-top: 10px;">
                <label>Subir Foto:</label>
                <input type="file" accept="image/*" onchange="comprimirImagen(event, 'p2')" style="width: 100%; font-size: 11px;">
                <input type="hidden" id="p2-photo">
            </div>

            <button class="btn-update" onclick="updateInfo('p2')">💾 Actualizar Datos P2</button>

            <div class="score-controls" style="display: flex; gap: 8px; margin-top: 15px; height: 40px; align-items: stretch;">
                <button onclick="changeScore('p2', -1)" style="flex: 1; font-size: 18px; font-weight: bold; margin: 0;"> -1 </button>
                <div style="flex: 1.5; background: #000; color: #0f0; border: 2px solid; border-color: #808080 #fff #fff #808080; font-family: monospace; font-size: 24px; display: flex; justify-content: center; align-items: center; margin: 0;">
                    <span id="p2-current-score">0</span>
                </div>
                <button onclick="changeScore('p2', 1)" style="flex: 1; font-size: 18px; font-weight: bold; margin: 0;"> +1 </button>                
            </div>            
        </div>

        <div style="background: #c0c0c0; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 10px; margin-bottom: 15px;">
            <label style="font-weight: bold; font-size: 12px;">Tu link para tu programa de streaming:</label>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <input type="text" id="overlayLink" readonly style="flex: 1; background: #e0e0e0; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 3px; font-size: 12px; color: #333;">
                <button id="btnCopiar" onclick="copiarLink()" style="padding: 2px 10px; font-size: 12px; cursor: pointer;">📋 Copiar</button>
            </div>
            <label style="font-weight: bold; font-size: 12px;">Tu link de sala permanente:</label>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <input type="text" id="permanentLink" readonly style="flex: 1; background: #e0e0e0; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 3px; font-size: 12px; color: #333;">
                <button id="btnCopiarPerm" onclick="copiarLinkPermanente()" style="padding: 2px 10px; font-size: 12px; cursor: pointer;">📋 Copiar</button>
            </div>
        </div>
        
        <button onclick="resetAll()" style="width:100%; color:red; margin-top:10px;">⚠️ RESETEAR TODO</button>
    </div>

    <script>
        // --- PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAcB2svnoMb1YOKQmwrrAa9i9vbSqxNprw",
            authDomain: "score-w95.firebaseapp.com",
            databaseURL: "https://score-w95-default-rtdb.firebaseio.com",
            projectId: "score-w95",
            storageBucket: "score-w95.firebasestorage.app",
            messagingSenderId: "244357143300",
            appId: "1:244357143300:web:e30629d5dbf0034f5bce51",
            measurementId: "G-R8VN2XHYM4"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        //const db = firebase.database().ref('match_data'); // Cambié el nodo a 'match_data' para limpiar lo anterior NO MULTIUSUARIO

        // 1. Obtener el parámetro 'room' de la URL (ej: control.html?room=mistream)
        const urlParams = new URLSearchParams(window.location.search);
        const currentRoom = urlParams.get('room');

        // 2. Validación de seguridad básica
        if (!currentRoom) {
            alert("No se especificó ninguna sala. Redirigiendo al inicio...");
            window.location.href = "index.html"; // Regresa al login si intentan entrar directo
        }

        // Apuntar Firebase a la sala específica
        const db = firebase.database().ref(`rooms/${currentRoom}`);        

        // Sincronizar el panel con los datos existentes (Nombres, Fotos y Puntos - mostrar fotos o no)
        db.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // Sincronizar Jugador 1
                if (data.p1) {
                    const p1Name = document.getElementById('p1-name');
                    const p1Photo = document.getElementById('p1-photo');
                    
                    if (document.activeElement !== p1Name) p1Name.value = data.p1.name || '';
                    if (document.activeElement !== p1Photo) p1Photo.value = data.p1.photo || '';
                    
                    // Actualizar el display del marcador P1
                    document.getElementById('p1-current-score').innerText = data.p1.score || 0;
                }

                // Sincronizar Jugador 2
                if (data.p2) {
                    const p2Name = document.getElementById('p2-name');
                    const p2Photo = document.getElementById('p2-photo');
                    
                    if (document.activeElement !== p2Name) p2Name.value = data.p2.name || '';
                    if (document.activeElement !== p2Photo) p2Photo.value = data.p2.photo || '';
                    
                    // Actualizar el display del marcador P2
                    document.getElementById('p2-current-score').innerText = data.p2.score || 0;
                }

                // Sincronizar el estado del checkbox y la UI
                const showPhotos = data.settings && data.settings.showPhotos !== undefined 
                                   ? data.settings.showPhotos 
                                   : true; // Por defecto encendido
                
                // Actualiza el checkbox visualmente
                document.getElementById('toggle-photos').checked = showPhotos;

                // Oculta o muestra los campos de texto para las URLs
                const displayStyle = showPhotos ? 'block' : 'none';
                document.getElementById('photo-input-p1').style.display = displayStyle;
                document.getElementById('photo-input-p2').style.display = displayStyle;
            }

            // Sincronizar el estado del checkbox de intercambio
            const swapPlayers = data.settings && data.settings.swapPlayers !== undefined 
                                ? data.settings.swapPlayers 
                                : false; // Por defecto apagado (P1 a la izquierda)
                
            document.getElementById('toggle-swap').checked = swapPlayers;
        });

        // Función para guardar la configuración global
        function updateSettings() {
            const show = document.getElementById('toggle-photos').checked;
            const swap = document.getElementById('toggle-swap').checked; // Capturamos el nuevo checkbox
    
            db.child('settings').update({ 
                showPhotos: show,
                swapPlayers: swap // Lo guardamos en Firebase
            });
        }

        // Función para actualizar Nombre y Foto
        function updateInfo(player) {
            const name = document.getElementById(player + '-name').value;
            const photo = document.getElementById(player + '-photo').value;

            // Usamos .update para no borrar el puntaje actual
            db.child(player).update({
                name: name || "Player", // Si está vacío, pone Player
                photo: photo || ""      // Si está vacío, queda sin foto
            });
        }
        // Función para procesar, comprimir y convertir la imagen a Base64
        function comprimirImagen(event, player) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
    
            // Cuando el archivo local se termina de leer...
            reader.onload = function(e) {
                const img = new Image();
        
                // Cuando la imagen se carga en memoria...
                img.onload = function() {
                    // 1. Creamos un canvas virtual
                    const canvas = document.createElement('canvas');
                    const size = 150; // Redimensionamos a 150x150px (suficiente para el overlay)
                    canvas.width = size;
                    canvas.height = size;
            
                    const ctx = canvas.getContext('2d');
            
                    // 2. Rellenamos con fondo blanco (por si suben PNGs transparentes)
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, size, size);
            
                    // 3. Dibujamos la imagen estirada al cuadro
                    ctx.drawImage(img, 0, 0, size, size);
            
                    // 4. Convertimos el canvas a texto Base64 (JPEG al 70% de calidad)
                    const base64String = canvas.toDataURL('image/jpeg', 0.7);
            
                    // 5. Metemos ese texto en el input oculto que ya teníamos
                    document.getElementById(player + '-photo').value = base64String;
            
                    // Feedback visual retro
                    console.log(`Imagen de ${player} procesada y lista para subir.`);
                };
        
                img.src = e.target.result;
            };
    
            reader.readAsDataURL(file);
        }        

        // Función para Puntos (ahora busca dentro de /score)
        function changeScore(player, amount) {
            db.child(player + '/score').transaction((score) => (score || 0) + amount);
        }

        // Construir la URL absoluta para el overlay
        const baseURL = window.location.origin + window.location.pathname.replace('control.html', '');
        const finalOverlayURL = `${baseURL}overlay.html?room=${currentRoom}`;
        document.getElementById('overlayLink').value = finalOverlayURL;
        // Construir el link permanente (control.html?room=mistream)
        const finalPermanentURL = `${baseURL}control.html?room=${currentRoom}`;
        document.getElementById('permanentLink').value = finalPermanentURL;

        // Función para copiar al portapapeles con feedback visual
        function copiarLink() {
        const linkInput = document.getElementById('overlayLink');
        const btn = document.getElementById('btnCopiar');
    
        // Usamos la API nativa del navegador
        navigator.clipboard.writeText(linkInput.value)
            .then(() => {
                // Feedback visual: Cambiamos el texto temporalmente
                const textoOriginal = btn.innerHTML;
                btn.innerHTML = "✅ ¡Copiado! Pega este link en tu software de streaming.";
                btn.style.color = "green"; // Un toque de color para confirmar
            
                // Regresamos al estado original después de 5 segundos
                setTimeout(() => {
                    btn.innerHTML = textoOriginal;
                    btn.style.color = "";
                }, 5000);
            })
            .catch(err => {
                console.error('Error al copiar al portapapeles: ', err);
                alert("Tu navegador bloqueó la acción. Por favor, selecciona el texto y cópialo manualmente.");
            });
        }

        // Link permanente (control.html?room=mistream)
        function copiarLinkPermanente() {
            const linkInput = document.getElementById('permanentLink');
            const btn = document.getElementById('btnCopiarPerm');
        
            navigator.clipboard.writeText(linkInput.value)
                .then(() => {
                    const textoOriginal = btn.innerHTML;
                    btn.innerHTML = "✅ ¡Copiado! Guarda este link para administrar tu sala en el futuro.";
                    btn.style.color = "green";
            
                    setTimeout(() => {
                        btn.innerHTML = textoOriginal;
                        btn.style.color = "";
                    }, 5000);
                })
                .catch(err => {
                    console.error('Error al copiar al portapapeles: ', err);
                    alert("Tu navegador bloqueó la acción. Por favor, selecciona el texto y cópialo manualmente.");
                });
        }

        // Reset total
        function resetAll() {
            if(confirm("¿Borrar todo?")) {
                db.set({
                    p1: { name: "Player 1", score: 0, photo: "" },
                    p2: { name: "Player 2", score: 0, photo: "" }
                });
            }
        }
    </script>
</body>
</html>
