<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Win95</title>
    <style>
        /* Estilos básicos para que no se vea feo */
        body { font-family: sans-serif; background: #008080; padding: 20px; }
        .window { background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; padding: 10px; width: 300px; margin: 0 auto; }
        .title-bar { background: navy; color: white; padding: 2px 5px; margin-bottom: 10px; font-weight: bold; }
        button { 
            width: 45%; margin: 5px; padding: 10px; 
            background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff;
            cursor: pointer; font-weight: bold;
        }
        button:active { border-color: #808080 #fff #fff #808080; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <div class="window">
        <div class="title-bar">Admin_Panel.exe</div>
        <div style="text-align: center;">
            <h3>JUGADOR 1</h3>
            <button onclick="changeScore('p1', 1)">+1</button>
            <button onclick="changeScore('p1', -1)">-1</button>
            <hr>
            <h3>JUGADOR 2</h3>
            <button onclick="changeScore('p2', 1)">+1</button>
            <button onclick="changeScore('p2', -1)">-1</button>
            <hr>
            <button onclick="resetScores()" style="width: 90%; color: red;">RESET 0-0</button>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        // Pega aquí tu objeto real de Firebase
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAcB2svnoMb1YOKQmwrrAa9i9vbSqxNprw",
  authDomain: "score-w95.firebaseapp.com",
  databaseURL: "https://score-w95-default-rtdb.firebaseio.com",
  projectId: "score-w95",
  storageBucket: "score-w95.firebasestorage.app",
  messagingSenderId: "244357143300",
  appId: "1:244357143300:web:e30629d5dbf0034f5bce51",
  measurementId: "G-R8VN2XHYM4"
};

        // --- INICIALIZACIÓN (En este orden exacto) ---
        
        // 1. Iniciar App
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        } else {
            firebase.app(); // Si ya estaba iniciada, usar la existente
        }

        // 2. Definir 'db' GLOBALMENTE (Aquí estaba el error antes)
        const db = firebase.database().ref('scores');

        // --- FUNCIONES ---

        // Función para subir/bajar puntos
        function changeScore(player, amount) {
            console.log(`Intentando cambiar ${player} en ${amount}...`);
            
            // Usamos transaction para evitar condiciones de carrera
            db.child(player).transaction((currentScore) => {
                // Si el valor no existe (null), asumimos 0
                return (currentScore || 0) + amount;
            }, (error, committed, snapshot) => {
                if (error) {
                    console.error('Error al actualizar:', error);
                    alert('Error: Revisa la consola (F12)');
                } else if (!committed) {
                    console.warn('No se guardaron los cambios.');
                } else {
                    console.log('¡Marcador actualizado!');
                }
            });
        }

        // Función extra para reiniciar el marcador
        function resetScores() {
            if(confirm("¿Reiniciar marcador a 0-0?")) {
                db.set({
                    p1: 0,
                    p2: 0
                });
            }
        }
    </script>
</body>
</html>
