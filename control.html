<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');
    </style>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="control.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <div class="window">
        <div class="title-bar" id="panel-title">Versus_Admin_v1.exe</div>

        <div class="panel-card">
    
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;">
                <div style="display: flex; gap: 15px; margin-bottom: 15px; width: 100%;">    
                    <div style="flex: 1;">
                        <label style="font-weight: bold; display: block; margin-bottom: 5px;">Tema Visual:</label>
                        <select id="theme-selector" onchange="cambiarTemaAutomatico()" style="width: 100%; padding: 5px; box-sizing: border-box;">
                            <option value="theme-win95">Retro (Windows 95)</option>
                            <option value="theme-modern-light">Moderno (Claro)</option>
                            <option value="theme-modern">Moderno (Oscuro)</option>
                            <option value="theme-pastel">Pastel (Suave)</option>
                            <option value="theme-stone">Rocoso (Piedra)</option>
                            <option value="theme-laser">Sci-Fi (Láser)</option>
                            <option value="theme-neon">Cyberpunk (Neón Brillante)</option>
                            <option value="theme-paper">Papel (Cuaderno)</option>
                            <option value="theme-metal">Metálico (Acero)</option>
                        </select>
                    </div>

                    <div style="flex: 1;">
                        <label style="font-weight: bold; display: block; margin-bottom: 5px;">Variante de Color:</label>
                        <select id="theme-variant" onchange="updateSettings()" style="width: 100%; padding: 5px; box-sizing: border-box;">
                        </select>
                    </div>    
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%;">
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; margin: 0;">
                        <input type="checkbox" id="toggle-vertical" onchange="updateSettings()">
                        Vertical
                    </label>

                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; margin: 0;">
                        <input type="checkbox" id="toggle-photos" onchange="updateSettings()" checked>
                        Mostrar fotos
                    </label>

                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; margin: 0;">
                        <input type="checkbox" id="toggle-swap" onchange="updateSettings()">
                        Invertir (P2 - P1)
                    </label>  
                </div>
                      
            </div>

            <div style="margin-top: 15px; border-top: 1px dashed var(--main-color, #808080); padding-top: 15px;">               
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Título del Overlay:</label>
                <input type="text" id="custom-title" onchange="updateSettings()" style="width: 100%; padding: 5px; box-sizing: border-box;">

                <label style="font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 5px;">
                    <span>Opacidad:</span>
                    <span id="opacity-val">100%</span>
                </label>
                <input type="range" id="widget-opacity" min="20" max="100" value="100" oninput="document.getElementById('opacity-val').innerText = this.value + '%'; updateSettings()" style="width: 100%; cursor: pointer;">
            </div>            

        </div>      

        <div class="player-section">
            <div class="section-title">PLAYER 1</div>
            
            <label style="display: block; margin-bottom: 5px;">Nombre:</label>
            <input type="text" id="p1-name" placeholder="Ej: Goku" style="width: 100%; box-sizing: border-box;">
            
            <div id="photo-input-p1" style="margin-top: 10px;">
                <label style="font-size: 12px; display: block;">Subir Foto:</label>    
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 5px;">
                    <input type="file" accept="image/*" onchange="comprimirImagen(event, 'p1')" style="flex: 1; font-size: 11px;">        
                    <img id="preview-p1" class="photo-frame" style="display: none; width: 35px; height: 35px; object-fit: cover; flex-shrink: 0;">
                </div>    
                <input type="hidden" id="p1-photo"> 
            </div>
            
            <button class="btn-update" onclick="updateInfo('p1')" style="width: 100%; margin-top: 10px; padding: 8px;">💾 Actualizar Datos P1</button>

            <div style="display: flex; gap: 8px; margin-top: 15px; height: 40px; align-items: stretch;">
                <button onclick="changeScore('p1', -1)" style="flex: 1; font-size: 18px; font-weight: bold; margin: 0;"> -1 </button>
                <div class="score-box" style="flex: 1.5; background: #000; display: flex; justify-content: center; align-items: center; margin: 0; font-size: 24px;">
                    <span id="p1-current-score">0</span>
                </div>
                <button onclick="changeScore('p1', 1)" style="flex: 1; font-size: 18px; font-weight: bold; margin: 0;"> +1 </button>                
            </div>            
        </div>

        <div class="player-section">
            <div class="section-title">PLAYER 2</div>
            
            <label style="display: block; margin-bottom: 5px;">Nombre:</label>
            <input type="text" id="p2-name" placeholder="Ej: Vegeta" style="width: 100%; box-sizing: border-box;">
            
            <div id="photo-input-p2" style="margin-top: 10px;">
                <label style="font-size: 12px; display: block;">Subir Foto:</label>    
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 5px;">
                    <input type="file" accept="image/*" onchange="comprimirImagen(event, 'p2')" style="flex: 1; font-size: 11px;">        
                    <img id="preview-p2" class="photo-frame" style="display: none; width: 35px; height: 35px; object-fit: cover; flex-shrink: 0;">
                </div>    
                <input type="hidden" id="p2-photo">
            </div>

            <button class="btn-update" onclick="updateInfo('p2')" style="width: 100%; margin-top: 10px; padding: 8px;">💾 Actualizar Datos P2</button>

            <div style="display: flex; gap: 8px; margin-top: 15px; height: 40px; align-items: stretch;">
                <button onclick="changeScore('p2', -1)" style="flex: 1; font-size: 18px; font-weight: bold; margin: 0;"> -1 </button>
                <div class="score-box" style="flex: 1.5; background: #000; display: flex; justify-content: center; align-items: center; margin: 0; font-size: 24px;">
                    <span id="p2-current-score">0</span>
                </div>
                <button onclick="changeScore('p2', 1)" style="flex: 1; font-size: 18px; font-weight: bold; margin: 0;"> +1 </button>                
            </div>            
        </div>

        <div class="panel-card">
            <label style="font-weight: bold; font-size: 12px; display: block;">Tu link para tu programa de streaming:</label>
            <div style="display: flex; gap: 5px; margin-top: 5px; margin-bottom: 10px;">
                <input type="text" id="overlayLink" readonly style="flex: 1; padding: 5px; box-sizing: border-box;">
                <button id="btnCopiar" onclick="copiarLink()" style="padding: 5px 10px; font-size: 12px; cursor: pointer;">📋 Copiar</button>
            </div>
            <label style="font-weight: bold; font-size: 12px; display: block;">Tu link de sala de control permanente:</label>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <input type="text" id="permanentLink" readonly style="flex: 1; padding: 5px; box-sizing: border-box;">
                <button id="btnCopiarPerm" onclick="copiarLinkPermanente()" style="padding: 5px 10px; font-size: 12px; cursor: pointer;">📋 Copiar</button>
            </div>
        </div>
        
        <button onclick="resetAll()" style="width:100%; color:red; margin-top:10px; padding: 10px; font-weight: bold; border: 1px solid red; background: transparent;">⚠️ RESETEAR TODO</button>
    </div>

    <script defer src="control.js"></script>
</body>
</html>
