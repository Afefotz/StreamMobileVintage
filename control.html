<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>

    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="control.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <div class="window">
        <div class="title-bar" id="panel-title">Versus_Admin_v1.exe</div>

        <div style="background: #c0c0c0; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 10px; margin-bottom: 15px;">
    
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;">
                <label style="font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: bold;">Tema Visual:</label>
                <select id="theme-selector" onchange="cambiarTemaAutomatico()" style="width: 100%; margin-top: 5px; margin-bottom: 10px; font-size: 12px; padding: 4px; border: 2px solid; border-color: #808080 #fff #fff #808080;">
                    <option value="theme-win95">Retro (Windows 95)</option>
                    <option value="theme-modern-light">Moderno (Claro)</option>
                    <option value="theme-modern">Moderno (Oscuro)</option>
                    <option value="theme-pastel">Pastel (Suave)</option>
                    <option value="theme-stone">Rocoso (Piedra)</option>
                    <option value="theme-laser">Sci-Fi (Rojo Neón)</option>
                    <option value="theme-neon">Cyberpunk (Neón Brillante)</option>
                </select>

                <label style="font-family: 'Segoe UI', sans-serif; font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; color: #000; margin: 0;">
                    <input type="checkbox" id="toggle-vertical" onchange="updateSettings()">
                    Vertical
                </label>

                <label style="font-family: 'Segoe UI', sans-serif; font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; margin: 0;">
                    <input type="checkbox" id="toggle-photos" onchange="updateSettings()" checked>
                    Mostrar fotos
                </label>

                <label style="font-family: 'Segoe UI', sans-serif; font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; margin: 0;">
                    <input type="checkbox" id="toggle-swap" onchange="updateSettings()">
                    Invertir (P2 - P1)
                </label>        
            </div>

            <div style="margin-top: 10px; border-top: 1px solid #808080; padding-top: 10px;">               
                <label style="font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: bold;">Título del Overlay:</label>
                <input type="text" id="custom-title" onchange="updateSettings()" style="width: 100%; margin-top: 5px; font-size: 12px; padding: 4px; border: 2px solid; border-color: #808080 #fff #fff #808080; box-sizing: border-box;">        
            </div>

        </div>       

        <div class="player-section">
            <div class="section-title">PLAYER 1</div>
            
            <label>Nombre:</label>
            <input type="text" id="p1-name" placeholder="Ej: Goku">
            
            <div id="photo-input-p1" style="margin-top: 10px;">
                <label style="font-size: 12px;">Subir Foto:</label>    
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 3px;">
                    <input type="file" accept="image/*" onchange="comprimirImagen(event, 'p1')" style="flex: 1; font-size: 10px;">        
                    <img id="preview-p1" style="display: none; width: 35px; height: 35px; border: 2px solid; border-color: #808080 #fff #fff #808080; object-fit: cover; background: #fff; flex-shrink: 0;">
                </div>    
                <input type="hidden" id="p1-photo"> 
            </div>
            
            <button class="btn-update" onclick="updateInfo('p1')">💾 Actualizar Datos P1</button>

            <div class="score-controls" style="display: flex; gap: 8px; margin-top: 15px; height: 40px; align-items: stretch;">
                <button onclick="changeScore('p1', -1)" style="flex: 1; font-size: 18px; font-weight: bold; margin: 0;"> -1 </button>
                <div style="flex: 1.5; background: #000; color: #0f0; border: 2px solid; border-color: #808080 #fff #fff #808080; font-family: monospace; font-size: 24px; display: flex; justify-content: center; align-items: center; margin: 0;">
                    <span id="p1-current-score">0</span>
                </div>
                <button onclick="changeScore('p1', 1)" style="flex: 1; font-size: 18px; font-weight: bold; margin: 0;"> +1 </button>                
            </div>             
        </div>

        <div class="player-section">
            <div class="section-title">PLAYER 2</div>
            
            <label>Nombre:</label>
            <input type="text" id="p2-name" placeholder="Ej: Vegeta">
            
            <div id="photo-input-p2" style="margin-top: 10px;">
                <label style="font-size: 12px;">Subir Foto:</label>    
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 3px;">
                    <input type="file" accept="image/*" onchange="comprimirImagen(event, 'p2')" style="flex: 1; font-size: 10px;">        
                    <img id="preview-p2" style="display: none; width: 35px; height: 35px; border: 2px solid; border-color: #808080 #fff #fff #808080; object-fit: cover; background: #fff; flex-shrink: 0;">
                </div>    
            <input type="hidden" id="p2-photo">
        </div>

            <button class="btn-update" onclick="updateInfo('p2')">💾 Actualizar Datos P2</button>

            <div class="score-controls" style="display: flex; gap: 8px; margin-top: 15px; height: 40px; align-items: stretch;">
                <button onclick="changeScore('p2', -1)" style="flex: 1; font-size: 18px; font-weight: bold; margin: 0;"> -1 </button>
                <div style="flex: 1.5; background: #000; color: #0f0; border: 2px solid; border-color: #808080 #fff #fff #808080; font-family: monospace; font-size: 24px; display: flex; justify-content: center; align-items: center; margin: 0;">
                    <span id="p2-current-score">0</span>
                </div>
                <button onclick="changeScore('p2', 1)" style="flex: 1; font-size: 18px; font-weight: bold; margin: 0;"> +1 </button>                
            </div>            
        </div>

        <div style="background: #c0c0c0; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 10px; margin-bottom: 15px;">
            <label style="font-weight: bold; font-size: 12px;">Tu link para tu programa de streaming:</label>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <input type="text" id="overlayLink" readonly style="flex: 1; background: #e0e0e0; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 3px; font-size: 12px; color: #333;">
                <button id="btnCopiar" onclick="copiarLink()" style="padding: 2px 10px; font-size: 12px; cursor: pointer;">📋 Copiar</button>
            </div>
            <label style="font-weight: bold; font-size: 12px;">Tu link de sala de control permanente:</label>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <input type="text" id="permanentLink" readonly style="flex: 1; background: #e0e0e0; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 3px; font-size: 12px; color: #333;">
                <button id="btnCopiarPerm" onclick="copiarLinkPermanente()" style="padding: 2px 10px; font-size: 12px; cursor: pointer;">📋 Copiar</button>
            </div>
        </div>
        
        <button onclick="resetAll()" style="width:100%; color:red; margin-top:10px;">⚠️ RESETEAR TODO</button>
    </div>

    <script defer src="control.js"></script>
</body>
</html>
